name: "MobileSec Security Scanner"
description: "移动应用安全扫描 Agent - 基于 AboutSecurity 知识库"
author: "MobileSec"

inputs:
  project-root:
    description: "项目根目录"
    required: false
    default: "."
  config-path:
    description: "配置文件路径"
    required: false
    default: ".mobilesec/config.yaml"
  aboutsecurity-path:
    description: "AboutSecurity 知识库路径"
    required: false
    default: ""
  stages:
    description: "要执行的阶段 (逗号分隔: dependency,sast,dast,mobile)"
    required: false
    default: "dependency,sast,mobile"
  output-dir:
    description: "报告输出目录"
    required: false
    default: "./security-reports"
  report-format:
    description: "报告格式: markdown | sarif | both（sarif 可直接上传 GitHub Code Scanning）"
    required: false
    default: "markdown"
  fail-on-critical:
    description: "发现严重漏洞时是否失败"
    required: false
    default: "true"

outputs:
  report-path:
    description: "生成的报告文件路径"
    value: ${{ steps.scan.outputs.report_path }}
  total-findings:
    description: "发现的安全问题总数"
    value: ${{ steps.scan.outputs.total_findings }}
  sarif-path:
    description: "生成的 SARIF 报告路径（report-format 为 sarif/both 时）"
    value: ${{ steps.scan.outputs.sarif_path }}

runs:
  using: "composite"
  steps:
    - name: 安装 Python 依赖
      shell: bash
      run: |
        python -m pip install semgrep bandit
        python -m pip install -e "${{ github.action_path }}"

    - name: 安装安全工具
      shell: bash
      run: |
        # 安装 Trivy
        if ! command -v trivy &> /dev/null; then
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        fi
        # 安装 Nuclei (可选)
        if ! command -v nuclei &> /dev/null; then
          curl -sL https://github.com/projectdiscovery/nuclei/releases/download/v3.3.7/nuclei_3.3.7_linux_amd64.zip -o nuclei.zip
          unzip -o nuclei.zip -d /usr/local/bin nuclei 2>/dev/null || true
          rm -f nuclei.zip
        fi

    - name: 执行安全扫描
      id: scan
      shell: bash
      env:
        PROJECT_ROOT: ${{ inputs.project-root }}
        CONFIG_PATH: ${{ inputs.config-path }}
        STAGES: ${{ inputs.stages }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        REPORT_FORMAT: ${{ inputs.report-format }}
        ABOUTSECURITY_PATH: ${{ inputs.aboutsecurity-path }}
        FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
      run: |
        ARGS=(--project-root "$PROJECT_ROOT" --config "$CONFIG_PATH" --stages "$STAGES" --output "$OUTPUT_DIR" --format "$REPORT_FORMAT")

        if [ -n "$ABOUTSECURITY_PATH" ]; then
          ARGS+=(--aboutsecurity-path "$ABOUTSECURITY_PATH")
        fi

        if python -m mobilesec.cli "${ARGS[@]}"; then
          echo "scan_result=success" >> $GITHUB_OUTPUT
        else
          if [ "$FAIL_ON_CRITICAL" = "true" ]; then
            echo "::error::发现严重或高危漏洞，请查看安全报告"
            exit 1
          else
            echo "::warning::发现严重或高危漏洞，请查看安全报告"
          fi
        fi

        # 输出报告路径
        REPORT=$(ls -t ${{ inputs.output-dir }}/security-report-*.md 2>/dev/null | head -1)
        echo "report_path=${REPORT:-}" >> $GITHUB_OUTPUT
        SARIF=$(ls -t ${{ inputs.output-dir }}/security-report-*.sarif 2>/dev/null | head -1)
        echo "sarif_path=${SARIF:-}" >> $GITHUB_OUTPUT

    - name: 上传安全报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: ${{ inputs.output-dir }}/
        retention-days: 30
